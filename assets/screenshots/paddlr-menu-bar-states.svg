<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">Paddlr menu bar icon state examples</title>
  <desc id="desc">Four enlarged illustrative examples showing Paddlr menu bar icon combinations for enabled or disabled output and connected or disconnected controller status.</desc>
  <rect width="920" height="250" rx="28" fill="#0f0f12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(115 42)">
      <rect x="-58" y="-16" width="116" height="88" rx="28" fill="#1d1d22" stroke="#34343a"/>
      <circle cx="0" cy="28" r="23" fill="#0a84ff"/>
      <path d="M-12 24 h24 q8 0 10 9 l2 9 q1 5 -3 7 q-4 2 -8 -2 l-5 -5 h-16 l-5 5 q-4 4 -8 2 q-4 -2 -3 -7 l2 -9 q2 -9 10 -9z" fill="#ffffff"/>
      <circle cx="-7" cy="33" r="2.2" fill="#0a84ff"/>
      <circle cx="8" cy="33" r="2.2" fill="#0a84ff"/>
      <text x="0" y="112" fill="#ffffff" font-size="18" font-weight="700">Enabled</text>
      <text x="0" y="137" fill="#a7a7ad" font-size="15">Connected</text>
    </g>
    <g transform="translate(345 42)">
      <rect x="-58" y="-16" width="116" height="88" rx="28" fill="#1d1d22" stroke="#34343a"/>
      <circle cx="0" cy="28" r="23" fill="none" stroke="#0a84ff" stroke-width="4"/>
      <path d="M-12 24 h24 q8 0 10 9 l2 9 q1 5 -3 7 q-4 2 -8 -2 l-5 -5 h-16 l-5 5 q-4 4 -8 2 q-4 -2 -3 -7 l2 -9 q2 -9 10 -9z" fill="none" stroke="#0a84ff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-7" cy="33" r="2.2" fill="#0a84ff"/>
      <circle cx="8" cy="33" r="2.2" fill="#0a84ff"/>
      <text x="0" y="112" fill="#ffffff" font-size="18" font-weight="700">Disabled</text>
      <text x="0" y="137" fill="#a7a7ad" font-size="15">Connected</text>
    </g>
    <g transform="translate(575 42)">
      <rect x="-58" y="-16" width="116" height="88" rx="28" fill="#1d1d22" stroke="#34343a"/>
      <circle cx="0" cy="28" r="23" fill="#ff453a"/>
      <path d="M-12 24 h24 q8 0 10 9 l2 9 q1 5 -3 7 q-4 2 -8 -2 l-5 -5 h-16 l-5 5 q-4 4 -8 2 q-4 -2 -3 -7 l2 -9 q2 -9 10 -9z" fill="#ffffff"/>
      <circle cx="-7" cy="33" r="2.2" fill="#ff453a"/>
      <circle cx="8" cy="33" r="2.2" fill="#ff453a"/>
      <text x="0" y="112" fill="#ffffff" font-size="18" font-weight="700">Enabled</text>
      <text x="0" y="137" fill="#a7a7ad" font-size="15">Disconnected</text>
    </g>
    <g transform="translate(805 42)">
      <rect x="-58" y="-16" width="116" height="88" rx="28" fill="#1d1d22" stroke="#34343a"/>
      <circle cx="0" cy="28" r="23" fill="none" stroke="#ff453a" stroke-width="4"/>
      <path d="M-12 24 h24 q8 0 10 9 l2 9 q1 5 -3 7 q-4 2 -8 -2 l-5 -5 h-16 l-5 5 q-4 4 -8 2 q-4 -2 -3 -7 l2 -9 q2 -9 10 -9z" fill="none" stroke="#ff453a" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="-7" cy="33" r="2.2" fill="#ff453a"/>
      <circle cx="8" cy="33" r="2.2" fill="#ff453a"/>
      <text x="0" y="112" fill="#ffffff" font-size="18" font-weight="700">Disabled</text>
      <text x="0" y="137" fill="#a7a7ad" font-size="15">Disconnected</text>
    </g>
  </g>
  <text x="460" y="224" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#8e8e93">Illustrative examples; Paddlr renders the actual menu bar icons with macOS SF Symbols and your system accent color.</text>
</svg>
